<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade.mn Price Monitor - 24/7</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #fff;
            text-align: center;
        }
        h1 { color: #4ade80; }
        .status {
            background: #16213e;
            padding: 30px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .price {
            font-size: 48px;
            font-weight: bold;
            color: #60a5fa;
            margin: 20px 0;
        }
        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .connected { background: #4ade80; }
        .disconnected { background: #ef4444; }
        .info {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 10px;
        }
        .log {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            text-align: left;
            font-family: 'Courier New', monospace;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <h1>📊 Trade.mn Monitor</h1>
    <p>This page monitors USDT/MNT price 24/7 and sends alerts via Cloudflare Worker</p>
    
    <div class="status">
        <div>
            <span class="indicator" id="indicator"></span>
            <span id="connection-status">Connecting...</span>
        </div>
        <div class="price" id="current-price">---</div>
        <div class="info">
            Last updated: <span id="last-update">Never</span><br>
            Next check: <span id="next-check">---</span>
        </div>
    </div>

    <div class="log" id="log"></div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const WORKER_URL = 'https://trade-telegram-bot.monharvest.workers.dev';
        const CHECK_INTERVAL = 20 * 60 * 1000; // 20 minutes
        
        let currentPrice = null;
        let socket = null;
        let checkTimer = null;
        
        // Logging
        function log(message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
            
            // Keep only last 20 entries
            while (logDiv.children.length > 20) {
                logDiv.removeChild(logDiv.lastChild);
            }
        }
        
        // Update UI
        function updateUI(connected) {
            const indicator = document.getElementById('indicator');
            const status = document.getElementById('connection-status');
            
            if (connected) {
                indicator.className = 'indicator connected';
                status.textContent = 'Connected to Trade.mn';
            } else {
                indicator.className = 'indicator disconnected';
                status.textContent = 'Disconnected';
            }
            
            if (currentPrice) {
                document.getElementById('current-price').textContent = 
                    currentPrice.toLocaleString() + ' MNT';
                document.getElementById('last-update').textContent = 
                    new Date().toLocaleTimeString();
            }
        }
        
        // Send price to worker
        async function sendPriceToWorker() {
            if (!currentPrice) {
                log('⚠️ No price data to send');
                return;
            }
            
            try {
                log(`📤 Sending price ${currentPrice} to worker...`);
                
                const response = await fetch(`${WORKER_URL}/api/price-update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pair: 'USDT/MNT',
                        price: currentPrice,
                        timestamp: new Date().toISOString()
                    })
                });
                
                const data = await response.json();
                
                if (data.alertTriggered) {
                    log(`🔔 Alert triggered! ${data.alertType} threshold`);
                } else {
                    log(`✅ Price checked - no alert (${currentPrice} MNT)`);
                }
            } catch (error) {
                log(`❌ Failed to send to worker: ${error.message}`);
            }
            
            // Schedule next check
            scheduleNextCheck();
        }
        
        // Schedule next check
        function scheduleNextCheck() {
            if (checkTimer) clearTimeout(checkTimer);
            
            const nextTime = new Date(Date.now() + CHECK_INTERVAL);
            document.getElementById('next-check').textContent = nextTime.toLocaleTimeString();
            
            checkTimer = setTimeout(sendPriceToWorker, CHECK_INTERVAL);
        }
        
        // Connect to Trade.mn
        function connectToTrade() {
            log('🔌 Connecting to Trade.mn WebSocket...');
            
            socket = io('https://trade.mn:8989', {
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionDelay: 5000,
                reconnectionAttempts: Infinity
            });
            
            socket.on('connect', () => {
                log('✅ Connected to Trade.mn');
                updateUI(true);
                socket.emit('message', ['join', 'USDT/MNT']);
                log('📡 Joined USDT/MNT channel');
            });
            
            socket.on('disconnect', () => {
                log('⚠️ Disconnected from Trade.mn');
                updateUI(false);
            });
            
            socket.on('connect_error', (error) => {
                log(`❌ Connection error: ${error.message}`);
                updateUI(false);
            });
            
            // Listen for price updates
            socket.on('orders', (data) => {
                try {
                    if (data.buy && data.sell) {
                        const buyPrices = Object.keys(data.buy).map(Number).filter(n => !isNaN(n));
                        const sellPrices = Object.keys(data.sell).map(Number).filter(n => !isNaN(n));
                        
                        if (buyPrices.length > 0 && sellPrices.length > 0) {
                            const bestBid = Math.max(...buyPrices);
                            const bestAsk = Math.min(...sellPrices);
                            currentPrice = (bestBid + bestAsk) / 2;
                            updateUI(true);
                        }
                    }
                } catch (e) {
                    log(`⚠️ Failed to parse orders: ${e.message}`);
                }
            });
            
            socket.on('trades', (trades) => {
                try {
                    if (Array.isArray(trades) && trades.length > 0 && trades[0].price) {
                        currentPrice = parseFloat(trades[0].price);
                        updateUI(true);
                    }
                } catch (e) {
                    log(`⚠️ Failed to parse trades: ${e.message}`);
                }
            });
            
            socket.on('matched_order', (order) => {
                try {
                    if (order && order.price) {
                        currentPrice = parseFloat(order.price);
                        updateUI(true);
                    }
                } catch (e) {
                    log(`⚠️ Failed to parse matched order: ${e.message}`);
                }
            });
        }
        
        // Initialize
        log('🚀 Monitor starting...');
        connectToTrade();
        
        // Send price immediately after 10 seconds
        setTimeout(() => {
            if (currentPrice) {
                sendPriceToWorker();
            } else {
                log('⚠️ No price data yet, waiting...');
                scheduleNextCheck();
            }
        }, 10000);
        
        // Keep page alive
        setInterval(() => {
            if (!socket || !socket.connected) {
                log('🔄 Reconnecting...');
                connectToTrade();
            }
        }, 60000); // Check every minute
    </script>
</body>
</html>
