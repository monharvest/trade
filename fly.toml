# fly.toml app configuration file generated for trade-monitor on 2026-01-17T23:20:00+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trade-monitor'
primary_region = 'nrt'

[build]

[env]
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=200'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    timeout = '2s'
    method = 'GET'
    path = '/health'

# Volume must exist before deploy: fly volumes create trade_data --size 1 --region nrt --app trade-monitor
[mounts]
  source = 'trade_data'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
