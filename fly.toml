# fly.toml app configuration file
# https://fly.io/docs/reference/configuration/

app = "trade-monitor"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  NODE_ENV = "production"
