name = "trade-mn-monitor"
main = "worker.js"
compatibility_date = "2024-01-01"

# Cron triggers - every 20 minutes
[triggers]
crons = ["*/20 * * * *"]

# Environment variables (non-secret)
[vars]
ALERT_BELOW = "3630"
ALERT_ABOVE = "3660"

# Secrets (set via: wrangler secret put TELEGRAM_BOT_TOKEN)
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_CHAT_ID
